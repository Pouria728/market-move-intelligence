name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pyodbc needs the unixODBC headers to build on Linux - not present by
      # default on the runner image.
      - run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app
